<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <rect width="32" height="32" rx="7" fill="#080d14"/>
  <!-- 4-pointed shuriken: two overlapping rotated rectangles -->
  <g transform="translate(16,16)">
    <!-- blade pointing up/down -->
    <polygon points="0,-13 3.5,-3.5 0,-1 -3.5,-3.5" fill="#f6821f"/>
    <polygon points="0,13 3.5,3.5 0,1 -3.5,3.5" fill="#f6821f"/>
    <!-- blade pointing left/right -->
    <polygon points="-13,0 -3.5,-3.5 -1,0 -3.5,3.5" fill="#f6821f"/>
    <polygon points="13,0 3.5,-3.5 1,0 3.5,3.5" fill="#f6821f"/>
    <!-- center circle -->
    <circle cx="0" cy="0" r="2.5" fill="#f6821f"/>
    <!-- inner highlight -->
    <circle cx="0" cy="0" r="1.2" fill="#080d14"/>
  </g>
</svg>
