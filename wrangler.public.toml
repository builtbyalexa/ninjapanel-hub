name = "ninjapanel-hub-public"
main = "worker/ideas-api.ts"
compatibility_date = "2024-12-30"
account_id = "your-cloudflare-account-id"

# Static assets — Worker handles /api/* and falls through to ASSETS for everything else
[assets]
directory = "./dist"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "single-page-application"
run_worker_first = true
